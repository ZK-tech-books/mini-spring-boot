plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.27'
    implementation 'tools.jackson.core:jackson-databind:3.1.8'
    implementation 'net.bytebuddy:byte-buddy:1.18.16'
}

javadoc {
    options.locale = 'ja_JP'
}
